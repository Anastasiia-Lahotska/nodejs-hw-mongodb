tags:
  - Contacts
summary: Створити новий контакт
operationId: createContact
description: Додає новий контакт для поточного користувача.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "John Doe"
          email:
            type: string
            example: "john@example.com"
          phone:
            type: string
            example: "+380501234567"
          favorite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary
responses:
  "201":
    description: Контакт успішно створено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully!
            data:
              $ref: ../../components/schemas/contact.yaml
  "400":
    description: Помилка валідації даних